<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Quiz - Source Code</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    h2 {
      margin-top: 2rem;
    }

    pre {
      background: #111;
      color: #eee;
      padding: 1.5rem;
      border-radius: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Accessibility Quiz — Source Code</h1>

  <h2>HTML</h2>
  <pre id="html-code">Loading HTML...</pre>

  <h2>CSS</h2>
  <pre id="css-code">Loading CSS...</pre>

  <script>
    fetch("../index.html")
      .then(response => response.text())
      .then(code => {
        document.getElementById("html-code").textContent = code;
      });

    fetch("../styles.css")
      .then(response => response.text())
      .then(code => {
        document.getElementById("css-code").textContent = code;
      });
  </script>

</body>
</html>
